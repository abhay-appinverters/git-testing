# .pre-commit-config.yaml
repos:
- repo: github.com
  rev: 24.4.0 # Use a specific version of Black
  hooks:
    - id: black
      # The 'args: [--check]' line means the commit will fail if code is NOT formatted.
      # This forces developers to run 'uv run black app' manually to pass.
      # If you want auto-formatting, remove the 'args: [--check]' line.
      args: ["--check", "--diff", "app"]

- repo: github.com
  rev: v0.6.2 # Use a specific version of Ruff
  hooks:
    # Use Ruff for linting AND for automatically fixing import sorting (I001)
    - id: ruff
      args: ["--fix", "app"]
