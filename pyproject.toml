[project]
name = "ai-project-v01"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"

# 🔐 Make sure all devs are on the same major Python version
requires-python = ">=3.13,<3.14"

dependencies = [
    "fastapi>=0.122.0",
    "pydantic-settings>=2.12.0",
    "requests>=2.32.5",
    "uvicorn>=0.38.0",
]

[dependency-groups]
dev = [
    # 🧹 Tools pinned so every dev uses the SAME versions
    "black==25.1.0",
    "pre-commit==4.5.0",
    "ruff==0.14.6",
]

[tool.black]
line-length = 88

# 🎯 Match your actual Python version
target-version = ["py313"]

include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | \.mypy_cache
  | \.ruff_cache
  | build
  | dist
  | dev
)/
'''

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["app"]

[tool.ruff.lint]
ignore = [
  "E501",  # line too long - Black handles it
]
select = [
  "E",  # pycodestyle errors
  "F",  # pyflakes
  "I",  # import sorting
]
