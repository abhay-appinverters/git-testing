[project]
name = "ai-project-v01"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.122.0",
    "pydantic-settings>=2.12.0",
    "requests>=2.32.5",
    "uvicorn>=0.38.0",
]

[dependency-groups]
dev = [
    "black>=25.11.0",
    "pre-commit>=4.5.0",
    "ruff>=0.14.6",
]

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | \.mypy_cache
  | \.ruff_cache
  | build
  | dist
  | dev
)/
'''

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["app"]
# 'ignore' and 'select' moved to the [tool.ruff.lint] section below

[tool.ruff.lint] # <- Add this new section header
ignore = [
  "E501",  # (optional) line too long - Black handles it
]
select = [
  "E",  # pycodestyle errors
  "F",  # pyflakes
  "I",  # import sorting
]
